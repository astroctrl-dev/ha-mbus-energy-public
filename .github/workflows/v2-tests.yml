name: M-Bus validation
on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q mbus_probe
      - name: Install test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Offline tests
        run: PYTHONPATH=mbus_probe python -m unittest discover -s mbus_probe -p 'test_*.py' -v
      - name: Build Home Assistant app image
        run: docker build -t mbus-v2-ci ./mbus_probe
      - name: Verify runtime imports
        run: docker run --rm --entrypoint python3 mbus-v2-ci -c 'import mbus_service, meter_ui, monthly_diagnostic, analysis_export, history_controller, history_model, clock_model, clock_maintenance'

  publish-stable:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish tested stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Fx 'version: "3.0.0"' mbus_probe/config.yaml
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)" = true
          if gh release view v3.0.0 >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v3.0.0" --jq .sha)" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v3.0.0 --target "$GITHUB_SHA" --latest --title "M-Bus v3.0.0" --notes-file RELEASE-3.0.0.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v3.0.0" --jq .sha)" = "$GITHUB_SHA"
