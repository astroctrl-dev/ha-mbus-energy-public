name: Publish M-Bus 2.1.0
on:
  workflow_run:
    workflows: ["M-Bus 2.1 validation"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify release candidate
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fx 'version: "2.1.0"' mbus_probe/config.yaml
          ! grep -REi 'Test auto-sync|clock-offset|test_offset_ready|ChatGPT|HA-MBUS-DEV|2[.]1[.]0-beta' README.md INSTALLASJON.md mbus_probe/{README.md,DOCS.md,meter_ui.py,clock_maintenance.py}
      - name: Create immutable version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v2.1.0 >/dev/null 2>&1; then
            echo 'v2.1.0 release already exists'
            exit 0
          fi
          if gh api repos/"$GITHUB_REPOSITORY"/git/ref/tags/v2.1.0 >/dev/null 2>&1; then
            echo 'Refusing to reuse an existing v2.1.0 tag'
            exit 1
          fi
          gh release create v2.1.0 --target "$TARGET_SHA" --title 'M-Bus T230 energimåling v2.1.0' --notes-file RELEASE-2.1.0.md
