    name: "Automatisk månadshistorikk"
    description: "Aktiver planlagd innhenting av månadshistorikk. Krev løyve ovanfor."
  allow_clock_sync:
    name: "Tillat klokkesynkronisering"
    description: "Tillat skriving til målarklokka."
  auto_clock_sync:
    name: "Automatisk klokkesynkronisering"
    description: "Aktiver planlagd klokkekontroll og tillaten korrigering."
  clock_timezone:
    name: "Tidssona til målaren"
    description: "Tidssone som blir brukt ved klokkeoperasjonar."
  mqtt_host:
    name: "MQTT-vert"
    description: "Vertsnamn eller adresse til MQTT-meklaren."
  mqtt_port:
    name: "MQTT-port"
    description: "Port til MQTT-meklaren."
  mqtt_username:
    name: "MQTT-brukarnamn"
    description: "Brukarnamn for MQTT-autentisering."
  mqtt_password:
    name: "MQTT-passord"
    description: "Passord for MQTT-autentisering."
