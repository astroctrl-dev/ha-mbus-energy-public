configuration:
  language:
    name: "Språk"
    description: "Språk i appen og Excel-eksporten. Auto brukar nettlesarspråket, med engelsk som reserve."
  temperature_unit:
    name: "Temperatureining i Excel"
    description: "Celsius (C), Kelvin (K) eller Fahrenheit (F) i Excel. Vel visingseiningane for sensorane i Home Assistant."
  serial_port:
    name: "Seriell eining"
    description: "Vel den serielle eininga som er kopla til M-Bus-masteren."
  baud:
    name: "Baudfart"
    description: "Fart for seriell kommunikasjon."
  interval_seconds:
    name: "Avlesingsintervall (s)"
    description: "Intervall mellom planlagde ordinære avlesingar i sekund."
  read_before_full_hour:
    name: "Avlesing før heil time"
    description: "Aktiver konfigurert forskyving før heil time."
  seconds_before_full_hour:
    name: "Sekund før heil time"
    description: "Forskyving når avlesing før heil time er aktivert."
  recovery_raw_log:
    name: "Rålogg ved gjenoppretting"
    description: "Aktiver logging av råtelegram ved gjenoppretting. Loggen kan innehalde målaridentifikatorar."
  allow_recovery_interface_reset:
    name: "Tillat gjenoppretting av grensesnitt"
    description: "Tillat eksisterande mekanisme å gjenopprette normal telegramstruktur."
  allow_monthly_history:
    name: "Tillat månadshistorikk"
    description: "Tillat innhenting av månadshistorikk."
