configuration:
  allow_diagnostic_capture:
    name: "Allow diagnostic test capture"
    description: "Permit one manually confirmed frame-5 evidence capture. No automatic reading or active status decoding."
  log_measurement_data:
    name: "Log measurement data"
    description: "Save decoded normal readings for Excel export; existing files are retained."
  raw_telegram_logging:
    name: "Log raw telegrams"
    description: "Save raw TX/RX locally. May contain meter identifiers and consumption. Restart to apply."
  serial_port:
    name: "Serial device"
    description: "Select the serial device connected to the M-Bus master."
  baud:
    name: "Baud rate"
    description: "Serial communication speed."
  interval_seconds:
    name: "Reading interval (s)"
    description: "Interval between scheduled regular readings in seconds."
  read_before_full_hour:
    name: "Read before the hour"
    description: "Enable the configured offset before the full hour."
  seconds_before_full_hour:
    name: "Seconds before the hour"
    description: "Offset used when reading before the full hour is enabled."
  recovery_raw_log:
    name: "Recovery raw log"
    description: "Enable raw telegram logging during recovery. Logs may contain meter identifiers."
  allow_recovery_interface_reset:
    name: "Allow interface recovery"
    description: "Permit the existing recovery mechanism to restore the normal telegram structure."
  allow_monthly_history:
    name: "Allow monthly history"
    description: "Permit monthly history retrieval."
  auto_monthly_history:
    name: "Automatic monthly history"
    description: "Enable scheduled monthly history retrieval. Requires permission above."
  allow_clock_sync:
    name: "Allow clock synchronization"
    description: "Permit writing the meter clock."
  auto_clock_sync:
    name: "Automatic clock synchronization"
    description: "Enable scheduled clock verification and permitted correction."
  clock_timezone:
    name: "Meter time zone"
    description: "Time zone used for meter clock operations."
  mqtt_host:
    name: "MQTT host"
    description: "Hostname or address of the MQTT broker."
  mqtt_port:
    name: "MQTT port"
    description: "Port of the MQTT broker."
  mqtt_username:
    name: "MQTT username"
    description: "Username for MQTT authentication."
  mqtt_password:
    name: "MQTT password"
    description: "Password for MQTT authentication."
