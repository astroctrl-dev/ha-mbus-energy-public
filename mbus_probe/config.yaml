name: "M-Bus T230 energimåling"
version: "3.0.0-beta.10"
slug: "mbus_probe"
description: "Read T230 via M-Bus, publish measurements with MQTT Discovery and retrieve history on demand."
arch:
  - amd64
startup: application
boot: manual
init: false
hassio_api: false
homeassistant_api: false
host_network: false
uart: true
ingress: true
ingress_port: 8099
panel_admin: true
options:
  serial_port:
  baud: 2400
  interval_seconds: 120
  read_before_full_hour: false
  log_measurement_data: false
  raw_telegram_logging: false
  recovery_raw_log: false
  allow_recovery_interface_reset: false
  allow_diagnostic_capture: false
  allow_address_diagnostic: false
  allow_address_write: false
  address_test_isolated: false
  address_test_meter_id: ""
  address_test_manufacturer: ""
  address_test_version: 0
  address_test_medium: 0
  address_test_device_number: ""
  allow_monthly_history: false
  auto_monthly_history: false
  allow_clock_sync: false
  auto_clock_sync: false
  clock_timezone: "Europe/Oslo"
  seconds_before_full_hour: 5
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  serial_port: device(subsystem=tty)
  baud: int
  interval_seconds: list(60|90|120|300|600)
  read_before_full_hour: bool
  log_measurement_data: bool
  raw_telegram_logging: bool
  recovery_raw_log: bool
  allow_recovery_interface_reset: bool
  allow_diagnostic_capture: bool
  allow_address_diagnostic: bool
  allow_address_write: bool
  address_test_isolated: bool
  address_test_meter_id: str?
  address_test_manufacturer: str?
  address_test_version: int(0,254)
  address_test_medium: int(0,254)
  address_test_device_number: str?
  allow_monthly_history: bool
  auto_monthly_history: bool
  allow_clock_sync: bool
  auto_clock_sync: bool
  clock_timezone: str
  seconds_before_full_hour: int(0,300)
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
