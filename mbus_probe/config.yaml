name: "M-Bus T230 MQTT bridge (v1.0.0)"
version: "1.0.0"
slug: "mbus_probe"
description: "Read-only T230 polling and MQTT Discovery for isolated HA-MBUS-DEV"
arch:
  - amd64
startup: application
boot: manual
init: false
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_admin: true
options:
  serial_port:
  baud: 2400
  interval_seconds: 120
  read_before_full_hour: false
  seconds_before_full_hour: 5
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  serial_port: device(subsystem=tty)
  baud: int
  interval_seconds: list(10|20|30|60|120|300|600)
  read_before_full_hour: bool
  seconds_before_full_hour: int(0,300)
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
